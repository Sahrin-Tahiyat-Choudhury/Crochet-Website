<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | The Yarn Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .order-card {
    border: 1px solid var(--blush-mid);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    background: rgba(255, 248, 243, 0.5);
  }
  .order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-family: var(--font-display);
    font-weight: 600;
  }
  .order-id {
    font-size: 14px;
    color: var(--brown-light);
  }
  .order-status {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .order-status.pending {
    background: #fff3cd;
    color: #856404;
  }
  .order-status.processing {
    background: #d1ecf1;
    color: #0c5460;
  }
  .order-status.shipped {
    background: #d4edda;
    color: #155724;
  }
  .order-status.delivered {
    background: #c3e6cb;
    color: #155724;
  }
  .order-status.cancelled {
    background: #f8d7da;
    color: #721c24;
  }
  .order-items {
    margin: 12px 0;
    padding: 12px 0;
    border-top: 1px solid var(--blush-light);
    border-bottom: 1px solid var(--blush-light);
  }
  .order-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
  }
  .order-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-family: var(--font-display);
    font-weight: 600;
  }
</style>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="logo-wrap">
      <div class="logo-text">🧶 TheYARN<em style="color:var(--brown);font-style:italic">Journey</em></div>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="home.html">Shop</a></li>
      <li><a href="product.html">Products</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="orders.html">My Orders</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" style="background:var(--peach);color:var(--dark);padding:7px 16px;border-radius:50px;font-weight:500">Login</a></li>
    </ul>
    <div class="nav-icons">
      <button class="nav-icon-btn" onclick="toggleSearch()" title="Search">🔍</button>
      <button class="nav-icon-btn" onclick="toggleCart()" title="Cart">
        🛒
        <span class="cart-badge" id="cart-badge">0</span>
      </button>
      <button class="hamburger" onclick="toggleMobileNav()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>
<div class="mobile-overlay" id="mobile-overlay" onclick="toggleMobileNav()"></div>
<div class="mobile-nav" id="mobile-nav">
  <button class="close-mobile" onclick="toggleMobileNav()">✕</button>
  <ul>
    <li><a href="index.html" onclick="toggleMobileNav()">Home</a></li>
    <li><a href="home.html" onclick="toggleMobileNav()">Shop</a></li>
    <li><a href="product.html" onclick="toggleMobileNav()">Products</a></li>
    <li><a href="cart.html" onclick="toggleMobileNav()">Cart</a></li>
    <li><a href="orders.html" onclick="toggleMobileNav()">My Orders</a></li>
    <li><a href="about.html" onclick="toggleMobileNav()">About</a></li>
    <li><a href="contact.html" onclick="toggleMobileNav()">Contact</a></li>
  </ul>
</div>

<section style="padding:80px 20px;min-height:60vh">
  <div class="section-inner" style="max-width:700px">
    <p class="section-label">Your Account</p>
    <h2 class="section-title">Your <em>Orders</em></h2>
    <div id="orders-list" style="margin-top:30px"></div>
    <div id="orders-empty" style="text-align:center;padding:60px 20px;display:none">
      <div style="font-size:60px;margin-bottom:16px">📦</div>
      <p style="font-family:var(--font-display);font-size:22px;color:var(--brown-light);margin-bottom:20px">You haven't placed any orders yet</p>
      <a href="home.html" class="btn-primary">Start Shopping →</a>
    </div>
  </div>
</section>

<script src="api.js"></script>
<script src="script.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', async () => {
    await initApp();
    if (window.location.pathname.endsWith('orders.html')) {
      await initOrdersPage();
    }
  });
</script>
</body>
</html>
