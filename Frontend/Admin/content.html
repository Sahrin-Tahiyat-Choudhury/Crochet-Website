<div class="page-header">
  <div class="page-header-left">
    <h1>Content Management 📝</h1>
    <p>Manage About Page, FAQs and Store Policies</p>
  </div>
</div>

<!-- ABOUT PAGE -->

<div class="card" style="margin-bottom:24px;">
  <div class="card-header">
    <span class="card-title">About Page</span>
  </div>

  <div class="card-body">

    <div class="form-group">
      <label class="form-label">Title</label>
      <input
        id="aboutTitle"
        class="form-input"
        placeholder="Our Story"
      >
    </div>

    <div class="form-group">
      <label class="form-label">Hero Title</label>
      <input
        id="aboutHeroTitle"
        class="form-input"
        placeholder="The Heart Behind The Yarn"
      >
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea
        id="aboutDescription"
        class="form-textarea"
        rows="8"
      ></textarea>
    </div>

    <button
      class="btn btn-primary"
      onclick="saveAbout()"
    >
      Save About Page
    </button>

  </div>
</div>

<!-- FAQ -->

<div class="card">

  <div class="card-header">
    <span class="card-title">Frequently Asked Questions</span>

    <button
      class="btn btn-primary btn-sm"
      onclick="addFaq()"
    >
      + Add FAQ
    </button>
  </div>

  <div class="card-body">

    <div id="faqContainer"></div>

    <div style="margin-top:20px;">
      <button
        class="btn btn-primary"
        onclick="saveFaqs()"
      >
        Save FAQs
      </button>
    </div>

  </div>

</div>
