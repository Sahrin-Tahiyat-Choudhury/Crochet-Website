<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — The Yarn Journey Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Orders</h1>
        <p id="pageSubtitle">Track and manage customer orders</p>
      </div>
      <div class="page-header-actions">
        <button onclick="exportOrders()">📤 Export</button>        
<button class="btn btn-primary" onclick="openManualOrderModal()">＋ Manual Order</button>      </div>
    </div>

    <!-- Stat Cards -->
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-info">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="totalOrders">0</div>
          <div class="stat-sub">↑ 12 this month</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <div class="stat-info">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="pendingOrders">0</div>
          <div class="stat-sub warn">Needs attention</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🚚</div>
        <div class="stat-info">
          <div class="stat-label">Shipped</div>
          <div class="stat-value" id="shippedOrders">0</div>
          <div class="stat-sub info">In transit</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-info">
          <div class="stat-label">Revenue (Month)</div>
          <div class="stat-value" id="monthlyRevenue">₹0</div>
          <div class="stat-sub">↑ 8% vs last month</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">All Orders</span>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="filterOrders('all')" id="tab-all" style="background:var(--accent);color:#fff;border-color:var(--accent);">All</button>
          <button class="btn btn-outline btn-sm" onclick="filterOrders('pending')" id="tab-pending">Pending</button>
          <button class="btn btn-outline btn-sm" onclick="filterOrders('shipped')" id="tab-shipped">Shipped</button>
          <button class="btn btn-outline btn-sm" onclick="filterOrders('delivered')" id="tab-delivered">Delivered</button>
        </div>
      </div>
      <div class="card-body" style="padding-bottom:0;">
        <div class="filters-row">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Search order ID, customer, product…" oninput="searchOrders(this.value)" />
          </div>
          <select class="filter-select" onchange="setPaymentFilter(this.value)">
            <option value="all">All Payment</option>
            <option value="paid">Paid</option>
            <option value="pending">Pending</option>
            <option value="refunded">Refunded</option>
          </select>

          <select class="filter-select" onchange="setDateSort(this.value)" style="min-width:150px;">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ORDER ID</th>
              <th>CUSTOMER</th>
              <th>PRODUCTS</th>
              <th>TOTAL</th>
              <th>PAYMENT</th>
              <th>STATUS</th>
              <th>DATE</th>
              <th>ACTIONS</th>
            </tr>
          </thead>
          <tbody id="ordersTbody"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span>Showing 1–7 of 7 orders</span>
        <div class="pagination-pages">
          <button class="page-btn" disabled>‹</button>
          <button class="page-btn active">1</button>
          <button class="page-btn" disabled>›</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="orderDetailModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="orderDetailTitle">Order #TYJ-0001</span>
      <button class="modal-close" onclick="closeModal('orderDetailModal')">✕</button>
    </div>
    <div class="modal-body" id="orderDetailBody">
      <!-- filled by JS -->
    </div>
    <!-- After modal-footer, close the .modal div -->
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('orderDetailModal')">Close</button>
      <button class="btn btn-primary" id="updateOrderBtn">Update Status</button>
    </div>
  </div>  <!-- ← this was missing -->
</div>

<!-- Manual Order Modal -->
<div class="modal-overlay" id="manualOrderModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Create Manual Order</span>
      <button class="modal-close" onclick="closeModal('manualOrderModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Customer Name</label>
<select id="manualCustomerId" class="form-select">
    <option value="">Select customer…</option>
  </select>      </div>
  <div class="form-group">
  <label class="form-label">Contact (Phone / Email)</label>
  <input id="manualContact" class="form-input" placeholder="Contact details" />
</div>
      
      <div class="form-group">
        <label class="form-label">Product</label>
        <!-- populated dynamically — see below -->
<select id="manualProduct" class="form-select">
  <option value="">Select product…</option>
</select>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Quantity</label>
          <input id="manualQuantity" class="form-input" type="number" value="1" min="1" />
        </div>
        <div class="form-group">
          <label class="form-label">Payment Method</label>
          <select id="manualPayment" class="form-select">
            <option>UPI</option>
            <option>Cash</option>
            <option>Bank Transfer</option>
            <option>Card</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Delivery Address</label>
        <textarea id="manualAddress" class="form-textarea"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('manualOrderModal')">Cancel</button>
      <button class="btn btn-primary" onclick="createManualOrder()">Create Order</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="../api.js"></script>
<script src="orders.js"></script>

</body>
</html>
