<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics — The Yarn Journey Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .chart-bar-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .chart-bar-label { width:120px; font-size:12.5px; color:var(--text-mid); text-align:right; flex-shrink:0; }
    .chart-bar-track { flex:1; height:28px; background:var(--border); border-radius:4px; overflow:hidden; }
    .chart-bar-fill  { height:100%; border-radius:4px; background:var(--accent); display:flex; align-items:center; padding-left:8px; color:#fff; font-size:11.5px; font-weight:600; transition:width 0.6s ease; }
    .chart-bar-value { width:60px; font-size:12.5px; font-weight:600; color:var(--text-dark); }

    .mini-chart { display:flex; align-items:flex-end; gap:4px; height:60px; }
    .mini-bar   { flex:1; border-radius:3px 3px 0 0; background:var(--accent); opacity:0.75; transition:opacity .2s; }
    .mini-bar:hover { opacity:1; }

    .analytics-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    .top-list { list-style:none; padding:0; margin:0; }
    .top-list li { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-light); font-size:13px; }
    .top-list li:last-child { border-bottom:none; }
    .top-rank { width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1>Analytics</h1>
        <p>Store performance overview · May 2026</p>
      </div>
      <div class="page-header-actions">
        <select class="filter-select" onchange="loadAnalytics(this.value)">
  <option value="this_month">This Month</option>
  <option value="last_month">Last Month</option>
  <option value="last_3_months">Last 3 Months</option>
  <option value="this_year">This Year</option>
</select>
        <button class="btn btn-outline" onclick="exportAnalytics()">📤 Export</button>
      </div>
    </div>

    <!-- KPI Cards -->
     <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:16px;">
    <div class="stat-card">
  <div class="stat-icon">💰</div>
  <div class="stat-info">
    <div class="stat-label">Revenue</div>
    <div class="stat-value" id="revenueValue">₹0</div>
    <div class="stat-sub" id="revenueSub"></div>
  </div>
</div>

<div class="stat-card">
  <div class="stat-icon">🛒</div>
  <div class="stat-info">
    <div class="stat-label">Orders</div>
    <div class="stat-value" id="ordersValue">0</div>
    <div class="stat-sub" id="ordersSub"></div>
  </div>
</div>

<div class="stat-card">
  <div class="stat-icon">📊</div>
  <div class="stat-info">
    <div class="stat-label">Avg Order Value</div>
    <div class="stat-value" id="avgOrderValue">₹0</div>
    <div class="stat-sub" id="avgOrderSub"></div>
  </div>
</div>

<div class="stat-card">
  <div class="stat-icon">👥</div>
  <div class="stat-info">
    <div class="stat-label">Customers</div>
    <div class="stat-value" id="customersValue">0</div>
    <div class="stat-sub" id="customersSub"></div>
  </div>
</div>
</div>

    <div class="analytics-grid">
      <!-- Revenue by Category -->
      <div class="card">
        <div class="card-header"><span class="card-title">Revenue by Category</span></div>
        <div class="card-body" id="categoryChart"></div>
      </div>

      <!-- Monthly Revenue Trend -->
      <div class="card">
        <div class="card-header"><span class="card-title">Monthly Revenue Trend</span></div>
        <div class="card-body">
          <div style="display:flex;align-items:flex-end;gap:6px;height:120px;padding-bottom:8px;" id="monthChart"></div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:6px;" id="monthLabels"></div>
        </div>
      </div>

      <!-- Top Products -->
      <div class="card">
        <div class="card-header"><span class="card-title">Top Products</span></div>
        <div class="card-body">
          <ul class="top-list" id="topProducts"></ul>
        </div>
      </div>

      <!-- Customer Cities -->
      <div class="card">
        <div class="card-header"><span class="card-title">Top Cities</span></div>
        <div class="card-body" id="cityChart"></div>
      </div>
    </div>

    <!-- Order Timeline -->
    <div class="card">
  <div class="card-header"><span class="card-title" id="dailyOrdersTitle">Daily Orders</span></div>
  <div class="card-body">
    <div style="display:flex;align-items:flex-end;gap:3px;height:80px;" id="dailyChart"></div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:8px;" id="dailyLabels"></div>
  </div>
</div>
  </main>
</div>

<script src="../api.js"></script>
<script src="shared.js"></script>
<script src="analytics.js"></script>
</body>
</html>
